name: Nexus

on:
  push:
    branches: [main, master, 'ccr-*']
    tags: ['nexus-v*']
    paths: ['nexus/**', '.github/workflows/nexus.yml']
  pull_request:
    paths: ['nexus/**', '.github/workflows/nexus.yml']
  workflow_dispatch:

concurrency:
  group: nexus-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nexus

jobs:
  check:
    name: Typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nexus/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - name: Bundle JS for Android (Hermes)
        working-directory: nexus/apps/mobile
        run: npx expo export --platform android --output-dir dist-bundle
      - name: Build relay
        working-directory: nexus/apps/relay
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-relay
          path: nexus/apps/relay/dist/nexus-relay.mjs
          if-no-files-found: error

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nexus/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nexus/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nexus/pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Version
        id: version
        run: |
          BASE=$(node -p "require('./apps/mobile/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/nexus-v* ]]; then NAME="${GITHUB_REF#refs/tags/nexus-v}"; else NAME="$BASE"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::NEXUS_KEYSTORE_BASE64 secret is not set; signing with the shared build key"
          fi
      - name: Build APK
        env:
          NEXUS_VERSION_NAME: ${{ steps.version.outputs.name }}
          NEXUS_VERSION_CODE: ${{ steps.version.outputs.code }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD || secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS || 'nexus' }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=4
        run: pnpm apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk-${{ steps.version.outputs.name }}
          path: |
            nexus/apps/mobile/dist/*.apk
            nexus/apps/mobile/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/nexus-v')
    needs: [check, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum nexus-relay.mjs >> SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: Nexus ${{ github.ref_name }}
          files: |
            artifacts/*.apk
            artifacts/nexus-relay.mjs
            artifacts/SHA256SUMS.txt
          body: |
            ## Установка на телефон
            1. Скачайте **`nexus-*-arm64-v8a.apk`** (подходит почти всем телефонам; для старых — `armeabi-v7a`, если не уверены — `universal`).
            2. Откройте файл и разрешите установку из этого источника.
            3. Вставьте API-ключ DeepSeek (или другого провайдера).

            ## Компьютер (необязательно)
            Скачайте `nexus-relay.mjs`, установите Node.js 20+ и запустите `node nexus-relay.mjs`, затем отсканируйте QR в приложении: Настройки → Компьютер.

            Контрольные суммы — в `SHA256SUMS.txt`.
